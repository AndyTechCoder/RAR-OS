# RAR OS local Codex boundary.
# Codex may freely modify this repository, but effects outside it fail closed
# except for narrowly reviewed Git/GitHub publication for AndyTechCoder/RAR-OS.

model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

default_permissions = "rar-os-ssd"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
allow_login_shell = false

[features]
goals = false

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false
exclude = [
    "AWS_*",
    "AZURE_*",
    "GOOGLE_*",
    "*PASSWORD*",
    "*SECRET*",
    "*TOKEN*",
]

[auto_review]
policy = """
## RAR OS repository boundary

The user authorizes autonomous work, including destructive edits, only inside
the active AndyTechCoder/RAR-OS repository and its protected Git metadata.

Approve when all side effects are confined to this repository, including:
- editing, creating, moving, or deleting repository files;
- repository-local build output under target/, out/, or evidence/;
- repository-provided host-only policy, static-analysis, formatting, test, and
  documentation scripts that cannot compile, link, image, or execute RAR target
  code on the Mac;
- Git index, branch, worktree, commit, and repository metadata operations for
  this repository;
- authenticated fetch, push, PR readiness, and evidence-gated merge operations whose only remote target
  is https://github.com/AndyTechCoder/RAR-OS or its GitHub API representation.

Deny every request that could affect anything outside the repository, except
the exact GitHub publication exception above. In particular deny:
- on the owner's Mac, any read, enumeration, write, move, deletion, permission
  change, or cleanup outside `/Volumes/Z Slim/Andy’s folder/Codex/RAR OS Alpha`,
  including its parents, siblings, and all unrelated SSD content;
- writes, moves, deletion, permission changes, or persistence outside the repo;
- sudo, administrator, root, login-shell, or broad unsandboxed execution;
- macOS settings, applications, services, login items, launch agents/daemons,
  keychain, privacy controls, system extensions, kernel extensions, firmware,
  NVRAM, startup disk, recoveryOS, or boot policy changes;
- raw disks, partitions, mounted volumes, physical devices, USB/PCI/GPU/camera/
  microphone passthrough, or host filesystem sharing;
- direct QEMU or other target/emulator execution before the separately recorded
  owner authorization for a certified RAR Lab profile;
- direct compiler, linker, object-copy, boot-image, firmware-image, or target
  build commands on the owner's Mac; target build and execution occur only in
  the approved cloud Development Lab;
- network access to any destination other than the canonical GitHub repository;
- credential discovery, export, logging, or transmission;
- changing .codex/config.toml, .codex/rules, AGENTS.md, docs/host-safety.md, or
  the approval record to weaken this boundary;
- requests to expand writable roots, enable general network access, disable the
  sandbox, enable danger-full-access, or change the reviewer away from this
  policy.

Do not approve broad cleanup, recursive permission changes, or retry/poll loops.
Do not approve force-push, force-with-lease, remote ref deletion, tag movement,
history rewrite, or any command that discards a pushed sprint checkpoint.
Worktree removal is eligible only for one exact registered RAR OS worktree after
its clean commits and merge are verified on the canonical GitHub repository.

If command parsing, destination, path ownership, or side effects are uncertain,
deny the request. Do not convert a denial into a broader alternative.
"""
[agents]
max_threads = 2
max_depth = 1
job_max_runtime_seconds = 1800
interrupt_message = true
