name: Modern crypto handoff
run-name: Modern crypto handoff ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed RAR source commit (five adapter input files only)
        required: true
        type: string
      inspect_first_failure:
        description: Inspect only the fixed retained failure artifact; do not rebuild or execute adapters
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: modern-crypto-handoff
  cancel-in-progress: false
jobs:
  compare:
    if: github.repository == 'AndyTechCoder/RAR-OS' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
    steps:
      - name: Check out exact trusted-main controller only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: controller
      - name: Integrated bounded compiler and independent reference comparison
        if: ${{ !inputs.inspect_first_failure }}
        env:
          RAR_SOURCE_SHA: ${{ inputs.source_sha }}
          RAR_CONTROLLER_SHA: ${{ github.sha }}
          RAR_ARTIFACT_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -I -B controller/tools/rar-lab/modern/crypto_handoff.py
      - name: Inspect fixed retained failure without target execution
        if: ${{ inputs.inspect_first_failure }}
        env:
          RAR_SOURCE_SHA: ${{ inputs.source_sha }}
          RAR_CONTROLLER_SHA: ${{ github.sha }}
          RAR_ARTIFACT_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -I -B controller/tools/rar-lab/modern/crypto_failure.py
      - name: Retain exact success or failure evidence
        if: ${{ always() && !inputs.inspect_first_failure }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modern-crypto-${{ github.run_id }}-${{ github.run_attempt }}
          path: modern-crypto-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
