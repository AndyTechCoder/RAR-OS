name: Controller Helper Closure Observer

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: controller-helper-closure-observer-main
  cancel-in-progress: false

jobs:
  observe:
    name: observe-controller-helper-closure
    if: github.repository == 'AndyTechCoder/RAR-OS'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAR_TRUSTED_CONTROLLER_SHA: ${{ github.sha }}
      RAR_EXPECTED_SOURCE_REVISION: ${{ github.sha }}
      RAR_CI_BOOTSTRAP_IMAGE: sha256:f49565f188ee00bc2a18dd418183f2c5f23ef7d6e691890517ed341a598f67c3
    steps:
      - name: Attest exact main runner
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$GITHUB_EVENT_NAME" == push ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$RAR_TRUSTED_CONTROLLER_SHA" ]]
          [[ "$GITHUB_SHA" == "$RAR_EXPECTED_SOURCE_REVISION" ]]
          [[ "${ImageOS-}" == ubuntu24 ]]
          [[ "${RUNNER_OS-}" == Linux ]]
          [[ "${RUNNER_ARCH-}" == X64 ]]
          [[ "${ImageVersion-}" =~ ^[0-9]+(\.[0-9]+)+$ ]]

      - name: Acquire exact main into bounded storage
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          checkout_image=rust:1.95.0@sha256:f49565f188ee00bc2a18dd418183f2c5f23ef7d6e691890517ed341a598f67c3
          runner_uid=$(/usr/bin/id -u)
          runner_gid=$(/usr/bin/id -g)
          identity="rar-c2b-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          acquisition="$identity-acquire"
          transfer="$identity-transfer"
          volume="$identity-source"
          partial="$RUNNER_TEMP/controller-helper-closure-checkout-partial-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            /usr/bin/timeout --kill-after=2s 10s /usr/bin/docker rm --force "$acquisition" "$transfer" >/dev/null 2>&1 || true
            /usr/bin/timeout --kill-after=2s 10s /usr/bin/docker volume rm --force "$volume" >/dev/null 2>&1 || true
            if [[ -n "${partial-}" && -d "$partial" ]]; then
              case "$partial" in
                "$RUNNER_TEMP"/controller-helper-closure-checkout-partial-"$GITHUB_RUN_ID"-"$GITHUB_RUN_ATTEMPT") /usr/bin/rm -rf -- "$partial" ;;
                *) return 1 ;;
              esac
            fi
          }
          trap cleanup EXIT HUP INT TERM
          [[ -d "$GITHUB_WORKSPACE" && ! -L "$GITHUB_WORKSPACE" ]]
          [[ -z "$(/usr/bin/find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)" ]]
          [[ ! -e "$partial" && ! -L "$partial" ]]
          ! /usr/bin/docker inspect "$acquisition" >/dev/null 2>&1
          ! /usr/bin/docker inspect "$transfer" >/dev/null 2>&1
          ! /usr/bin/docker volume inspect "$volume" >/dev/null 2>&1
          /usr/bin/install -d -m 700 "$partial"
          /usr/bin/docker volume create --driver local \
            --opt type=tmpfs --opt device=tmpfs \
            --opt "o=size=67108864,uid=$runner_uid,gid=$runner_gid,mode=0700,noexec,nosuid,nodev" \
            "$volume" >/dev/null
          /usr/bin/docker create --name "$acquisition" --read-only --network bridge \
            --user "$runner_uid:$runner_gid" --cpus 1 --memory 512m --memory-swap 512m --pids-limit 64 \
            --security-opt no-new-privileges --cap-drop ALL \
            --tmpfs "/tmp:rw,noexec,nosuid,nodev,size=64m,uid=$runner_uid,gid=$runner_gid,mode=700" \
            --mount "type=volume,source=$volume,target=/checkout" \
            "$checkout_image" /usr/bin/env -i \
            HOME=/tmp PATH=/usr/bin:/bin LC_ALL=C LANG=C GIT_CONFIG_NOSYSTEM=1 \
            GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/bin/false \
            /usr/bin/dash -c '
              set -eu
              /usr/bin/git init /checkout
              /usr/bin/git -C /checkout remote add origin https://github.com/AndyTechCoder/RAR-OS.git
              /usr/bin/git -C /checkout -c credential.helper= -c core.askPass= \
                -c filter.lfs.smudge= -c filter.lfs.required=false \
                fetch --no-tags --depth=1 origin "$1"
              /usr/bin/git -C /checkout -c filter.lfs.smudge= -c filter.lfs.required=false \
                checkout --detach FETCH_HEAD
              [ "$(/usr/bin/git -C /checkout rev-parse HEAD)" = "$1" ]
              [ -z "$(/usr/bin/git -C /checkout status --porcelain=v1 --untracked-files=all)" ]
              [ -z "$(/usr/bin/git -C /checkout for-each-ref --format="%(refname)")" ]
              bytes=$(/usr/bin/du -sb /checkout | /usr/bin/awk "{print \\$1}")
              files=$(/usr/bin/find -P /checkout -xdev -type f -printf x | /usr/bin/wc -c)
              set -- $(/usr/bin/git -C /checkout count-objects -v | /usr/bin/awk "/^(count|in-pack):/ {print \\$2}")
              [ "$#" -eq 2 ]
              objects=$(($1 + $2))
              [ "$bytes" -le 67108864 ] && [ "$files" -le 8192 ] && [ "$objects" -le 32768 ]
            ' rar-c2b-acquire "$GITHUB_SHA" >/dev/null
          /usr/bin/timeout --signal=TERM --kill-after=10s 120s /usr/bin/docker start --attach "$acquisition"
          [[ "$(/usr/bin/docker inspect --format '{{.State.ExitCode}}' "$acquisition")" -eq 0 ]]
          /usr/bin/timeout --kill-after=2s 10s /usr/bin/docker rm --force "$acquisition" >/dev/null
          acquisition=
          /usr/bin/docker create --name "$transfer" --read-only --network none \
            --user "$runner_uid:$runner_gid" --cpus 1 --memory 512m --memory-swap 512m --pids-limit 64 \
            --security-opt no-new-privileges --cap-drop ALL \
            --tmpfs "/tmp:rw,noexec,nosuid,nodev,size=64m,uid=$runner_uid,gid=$runner_gid,mode=700" \
            --mount "type=volume,source=$volume,target=/source,readonly" \
            --mount "type=bind,source=$partial,target=/destination" \
            "$checkout_image" /usr/bin/env -i \
            HOME=/tmp PATH=/usr/bin:/bin LC_ALL=C LANG=C GIT_CONFIG_NOSYSTEM=1 \
            GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/bin/false \
            /usr/bin/dash -c '
              set -eu
              /usr/bin/cp -a /source/. /destination/
              [ "$(/usr/bin/git -C /destination rev-parse HEAD)" = "$1" ]
              [ -z "$(/usr/bin/git -C /destination status --porcelain=v1 --untracked-files=all)" ]
              [ -z "$(/usr/bin/git -C /destination for-each-ref --format="%(refname)")" ]
              bytes=$(/usr/bin/du -sb /destination | /usr/bin/awk "{print \\$1}")
              files=$(/usr/bin/find -P /destination -xdev -type f -printf x | /usr/bin/wc -c)
              set -- $(/usr/bin/git -C /destination count-objects -v | /usr/bin/awk "/^(count|in-pack):/ {print \\$2}")
              [ "$#" -eq 2 ]
              objects=$(($1 + $2))
              [ "$bytes" -le 67108864 ] && [ "$files" -le 8192 ] && [ "$objects" -le 32768 ]
              [ "$(CDPATH= cd -- /destination && pwd -P)" = /destination ]
            ' rar-c2b-transfer "$GITHUB_SHA" >/dev/null
          /usr/bin/timeout --signal=TERM --kill-after=10s 30s /usr/bin/docker start --attach "$transfer"
          [[ "$(/usr/bin/docker inspect --format '{{.State.ExitCode}}' "$transfer")" -eq 0 ]]
          /usr/bin/timeout --kill-after=2s 10s /usr/bin/docker rm --force "$transfer" >/dev/null
          transfer=
          /usr/bin/timeout --kill-after=2s 10s /usr/bin/docker volume rm "$volume" >/dev/null
          volume=
          /usr/bin/chmod -R a-w "$partial"
          /usr/bin/rmdir "$GITHUB_WORKSPACE"
          /usr/bin/mv "$partial" "$GITHUB_WORKSPACE"
          partial=
          trap - EXIT HUP INT TERM

      - name: Verify exact immutable checkout
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        env:
          GIT_OPTIONAL_LOCKS: "0"
        run: |
          actual_sha=$(git rev-parse HEAD)
          [[ "$actual_sha" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          [[ ! -w tools/ci/run-controller-helper-closure-observer.sh ]]

      - name: Bind reviewed source identities
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          wrapper_sha=$(sha256sum tools/ci/run-controller-helper-closure-observer.sh | awk '{print $1}')
          subject_sha=$(sha256sum tools/ci/observe-controller-helper-closure.sh | awk '{print $1}')
          fixture_sha=$(sha256sum tools/ci/fixtures/controller-helper-closure-observer/base-closure.v0 | awk '{print $1}')
          pins_sha=$(sha256sum tools/ci/fixtures/controller-helper-closure-observer/tool-pins.v0 | awk '{print $1}')
          nonce=$(printf '%s' "$GITHUB_REPOSITORY|$GITHUB_SHA|$GITHUB_RUN_ID|$GITHUB_RUN_ATTEMPT|outer-record" | sha256sum | awk '{print $1}')
          {
            printf 'RAR_EXPECTED_WRAPPER_SHA256=%s\n' "$wrapper_sha"
            printf 'RAR_EXPECTED_SUBJECT_SHA256=%s\n' "$subject_sha"
            printf 'RAR_EXPECTED_FIXTURE_SHA256=%s\n' "$fixture_sha"
            printf 'RAR_EXPECTED_TOOL_PINS_SHA256=%s\n' "$pins_sha"
            printf 'RAR_EXPECTED_RECORD_NONCE=%s\n' "$nonce"
            printf 'RAR_EXPECTED_ARTIFACT_NAME=controller-helper-closure-observer-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'RAR_EXPECTED_RUN_ID=%s\n' "$GITHUB_RUN_ID"
            printf 'RAR_EXPECTED_RUN_ATTEMPT=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'RAR_CI_RUNNER_IMAGE_OS=%s\n' "$ImageOS"
            printf 'RAR_CI_RUNNER_IMAGE_VERSION=%s\n' "$ImageVersion"
            printf 'RAR_CI_RUNNER_OS=%s\n' "$RUNNER_OS"
            printf 'RAR_CI_RUNNER_ARCH=%s\n' "$RUNNER_ARCH"
          } >> "$GITHUB_ENV"

      - name: Prepare exclusive controller evidence root
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        env:
          EVIDENCE: ${{ runner.temp }}/controller-helper-closure-observer
        run: install -d -m 700 "$EVIDENCE"

      - name: Run isolated harness and one candidate observation
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        env:
          EVIDENCE: ${{ runner.temp }}/controller-helper-closure-observer
        run: tools/ci/run-controller-helper-closure-observer.sh "$GITHUB_WORKSPACE" "$EVIDENCE"

      - name: Independently validate exact candidate evidence
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        env:
          EVIDENCE: ${{ runner.temp }}/controller-helper-closure-observer
          RAR_EXPECTED_REPOSITORY: AndyTechCoder/RAR-OS
          RAR_EXPECTED_REF: refs/heads/main
          RAR_EXPECTED_EVENT: push
        run: |
          tools/ci/verify-controller-helper-closure-observer-run-evidence.sh \
            "$EVIDENCE" \
            tools/ci/run-controller-helper-closure-observer.sh \
            tools/ci/observe-controller-helper-closure.sh \
            tools/ci/fixtures/controller-helper-closure-observer/base-closure.v0 \
            tools/ci/fixtures/controller-helper-closure-observer/tool-pins.v0

      - name: Retain four validated candidate files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: controller-helper-closure-observer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/controller-helper-closure-observer/controller-helper-closure-observer.cases.v0
            ${{ runner.temp }}/controller-helper-closure-observer/controller-helper-closure.sha256
            ${{ runner.temp }}/controller-helper-closure-observer/controller-helper-closure.receipt
            ${{ runner.temp }}/controller-helper-closure-observer/controller-helper-closure-observer-run-evidence.v0
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          include-hidden-files: false
