name: Modern UEFI build
run-name: Modern UEFI build ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed canonical-repository source commit (40 lowercase hex)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: modern-uefi-build
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'AndyTechCoder/RAR-OS' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RAR_SOURCE_SHA: ${{ inputs.source_sha }}
      RAR_CONTROLLER_SHA: ${{ github.sha }}
    steps:
      - name: Validate exact source identifier before checkout
        run: |
          /usr/bin/python3 -I -B -c 'import os,re; assert re.fullmatch("[0-9a-f]{40}",os.environ["RAR_SOURCE_SHA"]), "exact source SHA required"'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RAR_CONTROLLER_SHA }}
          persist-credentials: false
          path: controller
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RAR_SOURCE_SHA }}
          persist-credentials: false
          path: source
      - name: Reproduce UEFI binaries without target execution
        run: /usr/bin/python3 -I -B controller/tools/rar-lab/modern/build_controller.py
      - name: Retain bounded build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modern-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: modern-build-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
