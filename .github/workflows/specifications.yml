name: Specifications

run-name: Specifications source ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: specifications-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: attest-runner-and-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RAR_TRUSTED_CONTROLLER_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
      RAR_EXPECTED_SOURCE_REVISION: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      RAR_EXPECTED_SOURCE_REPOSITORY: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
      RAR_CANONICAL_REPOSITORY: ${{ github.repository }}
      RAR_CI_BOOTSTRAP_IMAGE: sha256:f49565f188ee00bc2a18dd418183f2c5f23ef7d6e691890517ed341a598f67c3
    steps:
      - name: Verify CI runner evidence boundary
        shell: /usr/bin/dash -e {0}
        run: |
          set -u
          [ "${ImageOS-}" = ubuntu24 ]
          rar_ci_image_version=${ImageVersion-}
          rar_ci_image_date=${rar_ci_image_version%%.*}
          rar_ci_image_rest=${rar_ci_image_version#*.}
          [ "$rar_ci_image_rest" != "$rar_ci_image_version" ]
          rar_ci_image_build=${rar_ci_image_rest%%.*}
          rar_ci_image_revision=${rar_ci_image_rest#*.}
          [ "$rar_ci_image_revision" != "$rar_ci_image_rest" ]
          case "$rar_ci_image_revision" in *.*) exit 1 ;; esac
          [ "${#rar_ci_image_date}" -eq 8 ]
          for component in "$rar_ci_image_date" "$rar_ci_image_build" "$rar_ci_image_revision"; do
            case "$component" in '' | *[!0-9]*) exit 1 ;; esac
          done
          [ "${RUNNER_OS-}" = Linux ]
          [ "${RUNNER_ARCH-}" = X64 ]
          for revision in "$RAR_TRUSTED_CONTROLLER_SHA" "$RAR_EXPECTED_SOURCE_REVISION"; do
            [ "${#revision}" -eq 40 ]
            case "$revision" in *[!0-9a-f]*) exit 1 ;; esac
          done
          [ "$RAR_EXPECTED_SOURCE_REPOSITORY" = "$RAR_CANONICAL_REPOSITORY" ]
          printf '%s\n' \
            "RAR_CI_RUNNER_IMAGE_OS=$ImageOS" \
            "RAR_CI_RUNNER_IMAGE_VERSION=$ImageVersion" \
            "RAR_CI_RUNNER_OS=$RUNNER_OS" \
            "RAR_CI_RUNNER_ARCH=$RUNNER_ARCH" >> "$GITHUB_ENV"

      - name: Check out trusted base-revision controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.RAR_TRUSTED_CONTROLLER_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: controller

      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.RAR_EXPECTED_SOURCE_REPOSITORY }}
          ref: ${{ env.RAR_EXPECTED_SOURCE_REVISION }}
          fetch-depth: 1
          persist-credentials: false
          path: primary-source

      - name: Check out independent mutation-test source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.RAR_EXPECTED_SOURCE_REPOSITORY }}
          ref: ${{ env.RAR_EXPECTED_SOURCE_REVISION }}
          fetch-depth: 1
          persist-credentials: false
          path: mutation-source

      - name: Bind executable validation authority to trusted controller
        id: authority
        shell: /usr/bin/dash -e {0}
        run: |
          controller/tools/ci/check-specifications-authority.sh \
            "$GITHUB_WORKSPACE/controller" \
            "$GITHUB_WORKSPACE/primary-source" \
            "$GITHUB_OUTPUT"

      - name: Validate in pinned read-only container on attested runner
        if: steps.authority.outputs.execution == 'full'
        shell: /usr/bin/dash -e {0}
        run: |
          host_uid=$(/usr/bin/id -u)
          host_gid=$(/usr/bin/id -g)
          docker run --rm --read-only --network none \
            --user "$host_uid:$host_gid" \
            --cpus 2 --memory 2048m --memory-swap 2048m --pids-limit 256 \
            --security-opt no-new-privileges --cap-drop ALL \
            --tmpfs "/tmp:rw,nosuid,nodev,size=128m,uid=$host_uid,gid=$host_gid,mode=1777" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/primary-source,target=/workspace" \
            --workdir /workspace \
            --env RAR_EXPECTED_SOURCE_REVISION \
            --env RAR_CI_BOOTSTRAP_IMAGE \
            --env RAR_CI_RUNNER_IMAGE_OS \
            --env RAR_CI_RUNNER_IMAGE_VERSION \
            --env RAR_CI_RUNNER_OS \
            --env RAR_CI_RUNNER_ARCH \
            --env GITHUB_ACTIONS \
            --env CI \
            rust:1.95.0@sha256:f49565f188ee00bc2a18dd418183f2c5f23ef7d6e691890517ed341a598f67c3 \
            /usr/bin/dash -e -c '
              tools/ci/check-sprint-static.sh
              spec/fixtures/release-0/run.sh --ci
              sdk/generated/release-0/check.sh --compile
              tests/host-safety/run.sh
              tests/bootstrap/run.sh
              set +e
              output=$(tools/rarbuild/rarbuild run)
              status=$?
              set -e
              [ "$status" -eq 73 ]
              printf "%s\n" "$output" | grep -qx "resolver_invoked=false"
              printf "%s\n" "$output" | grep -qx "spawner_invoked=false"
              printf "%s\n" "$output" | grep -qx "target_execution=not-attempted"
            '

      - name: Run mutation policy tests with read-only source
        if: steps.authority.outputs.execution == 'full'
        shell: /usr/bin/dash -e {0}
        run: |
          host_uid=$(/usr/bin/id -u)
          host_gid=$(/usr/bin/id -g)
          docker run --rm --read-only --network none \
            --user "$host_uid:$host_gid" \
            --cpus 2 --memory 2048m --memory-swap 2048m --pids-limit 256 \
            --security-opt no-new-privileges --cap-drop ALL \
            --tmpfs "/tmp:rw,nosuid,nodev,size=128m,uid=$host_uid,gid=$host_gid,mode=1777" \
            --tmpfs "/build:rw,exec,nosuid,nodev,size=32m,uid=$host_uid,gid=$host_gid,mode=700" \
            --tmpfs "/evidence:rw,nosuid,nodev,noexec,size=64m,uid=$host_uid,gid=$host_gid,mode=700" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/mutation-source,target=/workspace,readonly" \
            --workdir /workspace \
            --env RAR_POLICY_MUTATION_TESTS=1 \
            --env RAR_QMP_SOURCE_TESTS=1 \
            --env RAR_ROOTFS_PROOF_SOURCE_TESTS=1 \
            --env RAR_EXPECTED_SOURCE_REVISION \
            --env RAR_CI_BOOTSTRAP_IMAGE \
            --env RAR_CI_RUNNER_IMAGE_OS \
            --env RAR_CI_RUNNER_IMAGE_VERSION \
            --env RAR_CI_RUNNER_OS \
            --env RAR_CI_RUNNER_ARCH \
            --env GITHUB_ACTIONS \
            --env CI \
            rust:1.95.0@sha256:f49565f188ee00bc2a18dd418183f2c5f23ef7d6e691890517ed341a598f67c3 \
            /usr/bin/dash -e -c '
              tools/ci/run-ephemeral-policy-tests.sh
              tools/ci/run-qmp-client-unit-tests.sh
              tools/ci/run-rootfs-proof-unit-tests.sh
            '
