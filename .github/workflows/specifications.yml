name: Specifications

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: attest-runner-and-validate
    runs-on: ubuntu-24.04
    env:
      RAR_EXPECTED_SOURCE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      RAR_CI_BOOTSTRAP_IMAGE: sha256:f49565f188ee00bc2a18dd418183f2c5f23ef7d6e691890517ed341a598f67c3
    steps:
      - name: Verify CI runner evidence boundary
        shell: /usr/bin/dash -e {0}
        run: |
          set -u
          [ "${ImageOS-}" = ubuntu24 ]
          [ "${ImageVersion-}" = 20260714.240.1 ]
          [ "${RUNNER_OS-}" = Linux ]
          [ "${RUNNER_ARCH-}" = X64 ]
          printf '%s\n' \
            "RAR_CI_RUNNER_IMAGE_OS=$ImageOS" \
            "RAR_CI_RUNNER_IMAGE_VERSION=$ImageVersion" \
            "RAR_CI_RUNNER_OS=$RUNNER_OS" \
            "RAR_CI_RUNNER_ARCH=$RUNNER_ARCH" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Validate in pinned read-only container on attested runner
        shell: /usr/bin/dash -e {0}
        run: |
          docker run --rm --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --workdir /workspace \
            --env RAR_EXPECTED_SOURCE_REVISION \
            --env RAR_CI_BOOTSTRAP_IMAGE \
            --env RAR_CI_RUNNER_IMAGE_OS \
            --env RAR_CI_RUNNER_IMAGE_VERSION \
            --env RAR_CI_RUNNER_OS \
            --env RAR_CI_RUNNER_ARCH \
            rust:1.95.0@sha256:f49565f188ee00bc2a18dd418183f2c5f23ef7d6e691890517ed341a598f67c3 \
            /usr/bin/dash -e -c '
              tools/ci/check-specs.sh
              /usr/bin/dash -n tools/rarbuild/rarbuild tools/rarbuild/bootstrap-lib.sh tests/host-safety/run.sh tests/bootstrap/run.sh
              tests/host-safety/run.sh
              tests/bootstrap/run.sh
              set +e
              output=$(tools/rarbuild/rarbuild run)
              status=$?
              set -e
              [ "$status" -eq 73 ]
              printf "%s\n" "$output" | grep -qx "resolver_invoked=false"
              printf "%s\n" "$output" | grep -qx "spawner_invoked=false"
              printf "%s\n" "$output" | grep -qx "target_execution=not-attempted"
            '
