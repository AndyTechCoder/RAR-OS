name: Specifications

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: attest-runner-and-validate
    runs-on: ubuntu-24.04
    env:
      RAR_EXPECTED_SOURCE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      RAR_CI_BOOTSTRAP_IMAGE: sha256:f49565f188ee00bc2a18dd418183f2c5f23ef7d6e691890517ed341a598f67c3
    steps:
      - name: Verify CI runner evidence boundary
        shell: /usr/bin/dash -e {0}
        run: |
          set -u
          [ "${ImageOS-}" = ubuntu24 ]
          [ "${ImageVersion-}" = 20260714.240.1 ]
          [ "${RUNNER_OS-}" = Linux ]
          [ "${RUNNER_ARCH-}" = X64 ]
          printf '%s\n' \
            "RAR_CI_RUNNER_IMAGE_OS=$ImageOS" \
            "RAR_CI_RUNNER_IMAGE_VERSION=$ImageVersion" \
            "RAR_CI_RUNNER_OS=$RUNNER_OS" \
            "RAR_CI_RUNNER_ARCH=$RUNNER_ARCH" >> "$GITHUB_ENV"

      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate host-only specifications and cutover
        shell: /usr/bin/dash -e {0}
        run: |
          host_uid=$(/usr/bin/id -u)
          host_gid=$(/usr/bin/id -g)
          docker run --rm --read-only --network none \
            --user "$host_uid:$host_gid" \
            --security-opt no-new-privileges --cap-drop ALL \
            --tmpfs "/tmp:rw,nosuid,nodev,size=128m,uid=$host_uid,gid=$host_gid,mode=1777" \
            --tmpfs "/build:rw,exec,nosuid,nodev,size=512m,uid=$host_uid,gid=$host_gid,mode=700" \
            --env RAR_PREAUTH_BUILD_ROOT=/build \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --workdir /workspace \
            --env RAR_EXPECTED_SOURCE_REVISION \
            --env RAR_CI_BOOTSTRAP_IMAGE \
            --env RAR_CI_RUNNER_IMAGE_OS \
            --env RAR_CI_RUNNER_IMAGE_VERSION \
            --env RAR_CI_RUNNER_OS \
            --env RAR_CI_RUNNER_ARCH \
            --env GITHUB_ACTIONS --env CI \
            rust:1.95.0@sha256:f49565f188ee00bc2a18dd418183f2c5f23ef7d6e691890517ed341a598f67c3 \
            /usr/bin/dash -e -c '
              tools/ci/check-preauth-cutover.sh --self-test
              tools/ci/check-specs.sh
              /usr/bin/dash -n tools/rarbuild/rarbuild tools/rarbuild/bootstrap-lib.sh tests/host-safety/run.sh tests/bootstrap/run.sh tests/preauth/run.sh tests/preauth/transaction-contracts.sh tests/preauth/input-producer-contracts.sh tests/preauth/container-compiler-contracts.sh tests/preauth/container-compiler-contracts-inner.sh tests/preauth/snapshot-repository-tree.sh tools/toolchain/preauth-transaction tools/toolchain/preauth-base-oci tools/toolchain/preauth-build-root.sh tools/toolchain/preauth-transfer-telemetry
              spec/fixtures/release-0/run.sh --ci
              sdk/generated/release-0/check.sh --compile
              tests/host-safety/run.sh
              tests/bootstrap/run.sh
              tests/preauth/run.sh
            '

  preauth-input-delivery:
    name: preauth-input-delivery-and-networkless-refusal
    runs-on: ubuntu-24.04
    env:
      RAR_CI_BOOTSTRAP_IMAGE: sha256:f49565f188ee00bc2a18dd418183f2c5f23ef7d6e691890517ed341a598f67c3
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate nested container compiler boundary
        shell: /usr/bin/dash -e {0}
        run: |
          compiler_root=$RUNNER_TEMP/preauth-container-compiler-root
          umask 077
          /usr/bin/mkdir -m 700 "$compiler_root"
          RAR_PREAUTH_BUILD_ROOT="$compiler_root" tests/preauth/container-compiler-contracts.sh
          /usr/bin/rmdir "$compiler_root"

      - name: Acquire two deterministic untrusted input bundles
        shell: /usr/bin/dash -e {0}
        run: |
          output=$(tools/toolchain/preauth-input-delivery --acquire-pair)
          printf '%s\n' "$output"
          case "$output" in input_bundle_sha256=????????????????????????????????????????????????????????????????) :;; *) exit 73;; esac
          one=${output#input_bundle_sha256=}
          printf 'RAR_INPUT_BUNDLE_SHA256=%s\n' "$one" >> "$GITHUB_ENV"

      - name: Parse delivery in a separate networkless transaction boundary
        shell: /usr/bin/dash -e {0}
        run: |
          host_uid=$(/usr/bin/id -u)
          host_gid=$(/usr/bin/id -g)
          snapshot_before=$RUNNER_TEMP/preauth-repository.before
          snapshot_after=$RUNNER_TEMP/preauth-repository.after
          transaction_stdout=$RUNNER_TEMP/preauth-transaction.stdout
          transaction_stderr=$RUNNER_TEMP/preauth-transaction.stderr
          tests/preauth/snapshot-repository-tree.sh "$snapshot_before"
          set +e
          docker run --rm --read-only --network none \
            --user "$host_uid:$host_gid" --security-opt no-new-privileges --cap-drop ALL \
            --tmpfs "/tmp:rw,nosuid,nodev,size=128m,uid=$host_uid,gid=$host_gid,mode=1777" \
            --tmpfs "/build:rw,exec,nosuid,nodev,size=512m,uid=$host_uid,gid=$host_gid,mode=700" \
            --env RAR_PREAUTH_BUILD_ROOT=/build \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" --workdir /workspace \
            --env RAR_PREAUTH_CONTAINER_IMAGE=sha256:f49565f188ee00bc2a18dd418183f2c5f23ef7d6e691890517ed341a598f67c3 \
            --env RAR_TRANSACTION_NETWORK=none \
            rust:1.95.0@sha256:f49565f188ee00bc2a18dd418183f2c5f23ef7d6e691890517ed341a598f67c3 \
            /usr/bin/dash -e tools/toolchain/preauth-transaction --prepare \
            out/r0/preauth/input-delivery/one/preauth-input-bundle-v1.tar \
            >"$transaction_stdout" 2>"$transaction_stderr"
          status=$?
          set -e
          [ "$status" -eq 73 ]
          [ ! -s "$transaction_stdout" ]
          grep -qx "preauth-transaction:evidence:input_bundle_sha256=$RAR_INPUT_BUNDLE_SHA256" "$transaction_stderr"
          grep -qx 'preauth-transaction:evidence:input_package_count=36' "$transaction_stderr"
          grep -qx 'preauth-transaction:m2-incomplete' "$transaction_stderr"
          tests/preauth/snapshot-repository-tree.sh "$snapshot_after"
          cmp -s "$snapshot_before" "$snapshot_after"
          grep '^preauth-transaction:evidence:' "$transaction_stderr"
          grep '^preauth-transaction:m2-incomplete$' "$transaction_stderr"
          printf '%s\n' \
            'target_execution=not-attempted' \
            'qemu_execution=not-attempted' \
            'emulator_execution=not-attempted' \
            'vm_execution=not-attempted' \
            'aws_calls=not-attempted'
