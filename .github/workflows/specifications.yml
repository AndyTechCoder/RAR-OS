name: Specifications

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    container:
      image: rust:1.95.0@sha256:f49565f188ee00bc2a18dd418183f2c5f23ef7d6e691890517ed341a598f67c3
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate specification handoff
        run: tools/ci/check-specs.sh

      - name: Validate host-only shell entry points
        run: /usr/bin/dash -n tools/rarbuild/rarbuild tools/rarbuild/bootstrap-lib.sh tests/host-safety/run.sh tests/bootstrap/run.sh

      - name: Run R0-000 host-safety suite
        env:
          RAR_CI_BOOTSTRAP_IMAGE: sha256:f49565f188ee00bc2a18dd418183f2c5f23ef7d6e691890517ed341a598f67c3
        run: tests/host-safety/run.sh

      - name: Run R0-001 bootstrap suite
        env:
          RAR_CI_BOOTSTRAP_IMAGE: sha256:f49565f188ee00bc2a18dd418183f2c5f23ef7d6e691890517ed341a598f67c3
        run: tests/bootstrap/run.sh

      - name: Prove execution routes remain refusal-only
        shell: /usr/bin/dash -e {0}
        run: |
          set +e
          output=$(tools/rarbuild/rarbuild run)
          status=$?
          set -e
          [ "$status" -eq 73 ]
          printf '%s\n' "$output" | grep -qx 'resolver_invoked=false'
          printf '%s\n' "$output" | grep -qx 'spawner_invoked=false'
          printf '%s\n' "$output" | grep -qx 'target_execution=not-attempted'
