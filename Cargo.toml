[workspace]
resolver = "3"
members = []

[workspace.package]
edition = "2024"
license = "LicenseRef-Proprietary-RAR"
repository = "https://github.com/AndyTechCoder/RAR-OS"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
